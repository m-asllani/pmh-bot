name: PMH bot

on:
  schedule:
    # GitHub often starts scheduled runs hours late (we've seen 4-6 h), so there are several
    # overnight triggers (UTC): ~23:30, 1:30, 3:30, 5:30 New York time. The first one to start
    # waits and hands off to a fresh run (`cloud` command); the session itself runs from ~6:20 ET.
    # Only one run executes at a time, so later triggers just find the work done and exit.
    - cron: "30 3,5,7,9 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: "Bot command, e.g. cloud, now, test-notify, replay --date 2026-10-13"
        default: "cloud"

permissions:
  contents: read
  actions: write  # start the next relay run + keep the schedule alive

concurrency:
  group: pmh-bot
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          COMMAND: ${{ github.event.inputs.command || 'cloud' }}
          GH_TOKEN: ${{ github.token }}
          PMH_NTFY_TOPIC: ${{ secrets.PMH_NTFY_TOPIC }}
          PMH_EMAIL_TO: ${{ secrets.PMH_EMAIL_TO }}
          PMH_RESEND_API_KEY: ${{ secrets.PMH_RESEND_API_KEY }}
          PMH_SMTP_USER: ${{ secrets.PMH_SMTP_USER }}
          PMH_SMTP_PASSWORD: ${{ secrets.PMH_SMTP_PASSWORD }}
          PMH_TELEGRAM_BOT_TOKEN: ${{ secrets.PMH_TELEGRAM_BOT_TOKEN }}
          PMH_TELEGRAM_CHAT_ID: ${{ secrets.PMH_TELEGRAM_CHAT_ID }}
          PMH_DISCORD_WEBHOOK: ${{ secrets.PMH_DISCORD_WEBHOOK }}
        run: python -m pmh_bot $COMMAND

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 90

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows in repos with no activity for 60 days.
        # Re-enabling the workflow resets that timer.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pmh-bot.yml/enable"
